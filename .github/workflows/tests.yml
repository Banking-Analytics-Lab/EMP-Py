# Runs the tests on each push to main and on each pull request. The publish workflow calls it
# before it builds a release, and it can also be started by hand from the Actions tab.
#
# The matrix covers Python 3.10 to 3.15 on Linux, the newest Python on Windows and macOS, and
# numpy 1.x on Python 3.12 (the last Python with numpy 1.x wheels). On Python 3.10, pip installs
# older numpy, scipy, scikit-learn and pandas releases, because the newest ones need 3.11 or 3.12.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}, ${{ matrix.os }}, ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        numpy: ["numpy"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            numpy: "numpy<2"
          - os: windows-latest
            python-version: "3.15"
            numpy: "numpy"
          - os: macos-latest
            python-version: "3.15"
            numpy: "numpy"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and pytest
        run: python -m pip install . pytest "${{ matrix.numpy }}"
      - name: Show the installed versions
        run: python -m pip list
      - name: Run pytest
        run: python -m pytest
